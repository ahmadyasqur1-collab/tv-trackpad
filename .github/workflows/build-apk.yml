name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APK for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TV-Trackpad.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Trackpad-APK
          path: TV-Trackpad.apk
