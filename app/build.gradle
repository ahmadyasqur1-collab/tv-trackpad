plugins {
    id 'com.android.application'
}

android {
    namespace 'id.lgtrackpad.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.lgtrackpad.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
